<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulonMind — Terminal Chat</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- Background particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- Terminal Container -->
    <div class="terminal-container" id="terminalContainer" data-theme="dark">
        <!-- Scanlines overlay -->
        <div class="scanlines"></div>

        <!-- Header -->
        <div class="terminal-header">
            <div class="traffic-light traffic-red" id="btnSettings" title="Settings"></div>
            <div class="traffic-light traffic-green" id="btnExpand" title="Toggle theme"></div>
            <button class="new-chat-btn" id="btnNewChat" title="New chat">＋</button>
            <div class="terminal-title">
                <span class="icon">⌘</span>NebulonMind — AI terminal
            </div>
            <div class="header-badge">
                <span class="dot"></span>online
            </div>
        </div>

        <!-- Message Area -->
        <div class="message-area" id="messageArea">
            <!-- Messages will be appended here -->
        </div>

        <!-- Input Area (command palette is anchored just above the input box) -->
        <div class="input-area" id="inputArea">
            <div class="command-palette" id="commandPalette">
                <div class="palette-header">Available Commands <span style="opacity:0.6;font-weight:normal;">— press Esc once to close</span></div>
                <div id="paletteItems">
                    <!-- Items generated by JS -->
                </div>
            </div>
            <span class="input-prompt">❯</span>
            <div class="input-wrapper">
                <input
                type="text"
                class="terminal-input"
                id="terminalInput"
                placeholder="Type a message or press / for commands..."
                autocomplete="off"
                spellcheck="false"
                autofocus
                />
            </div>
            <div class="input-hint">
                <kbd>/</kbd> commands
                <kbd>↑</kbd><kbd>↓</kbd> history
                <kbd>Tab</kbd> complete
                <kbd>Esc</kbd> close
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="settings-header">
                <span>⚙ NebulonMind settings</span>
                <button class="settings-close" id="settingsCloseBtn" title="Close settings">✕</button>
            </div>
            <div class="settings-body" id="settingsBody">
                <div class="settings-note">Loading settings…</div>
            </div>
            <div class="settings-footer">
                <button class="settings-btn settings-btn-danger" id="settingsRestartBtn">Restart service</button>
                <button class="settings-btn" id="settingsSaveBtn">Save</button>
            </div>
        </div>
    </div>

    <script src="js/main.js?v=escfix7"></script>
</body>
</html>
