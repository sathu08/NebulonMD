[paths]
nmd_home = /home/sathya/Codebase/NebulonMD

[backend]
ndb_api_host = localhost
ndb_api_port = 6969
ndb_api_scheme = 
ndb_api_connect_timeout = 0
ndb_api_read_timeout = 0
ndb_api_write_timeout = 0

[server]
nmd_api_host = 0.0.0.0
nmd_api_port = 9696
nmd_api_workers = 1
nmd_api_graceful_shutdown_seconds = 30
nmd_api_max_body_bytes = 1048576
nmd_api_backend_retries = 2
nmd_api_rate_limit_per_minute = 0
nmd_api_max_top_k = 50
nmd_api_max_context_characters = 50000
nmd_api_cors_origins = http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500
nmd_api_allow_plaintext_http = false
nmd_env = development
nmd_expected_backend_version = 

[secrets_store]
nmd_secrets_corpus = nmd_Secrets
nmd_secrets_segment = Authentication

[llm]
nmd_llm_provider = other
nmd_llm_model = glm-4.5-flash
nmd_llm_base_url = https://open.bigmodel.cn/api/paas/v4/
nmd_llm_timeout = 60
nmd_llm_max_retries = 1
nmd_llm_thinking = false
nmd_llm_extractor = true
nmd_llm_extractor_lenient = true

[lifecycle]
nmd_temporary_ttl_seconds = 2592000
nmd_lifecycle_auto_cleanup = true
nmd_lifecycle_auto_cleanup_cron = 0 3 * * *

[retrieval]
nmd_retrieval_top_k = 5
nmd_retrieval_candidates = 15

[ranking]
nmd_ranking_semantic_weight = 0.5
nmd_ranking_importance_weight = 0.2
nmd_ranking_confidence_weight = 0.15
nmd_ranking_recency_weight = 0.15
nmd_ranking_recency_half_life_days = 30

[context]
nmd_context_max_items = 10
nmd_context_max_characters = 4000

[agent]
nmd_agent_model = glm-4.5-flash
nmd_agent_temperature = 0
nmd_agent_max_turns = 4
nmd_agent_max_recall = 0
nmd_agent_max_sessions = 100
nmd_agent_session_ttl_seconds = 3600
nmd_agent_durable_sessions = false
nmd_agent_system_prompt = 

[background]
nmd_background_user = nmd_user_01
nmd_background_persist_state = false

[monitor]
nmd_monitor_enabled = true
nmd_monitor_project = default
nmd_monitor_sample_rate = 1
nmd_monitor_redact = true
nmd_monitor_max_body_chars = 2000
nmd_monitor_retention_days = 90

[runner]
nmd_skip_backend_check = false

