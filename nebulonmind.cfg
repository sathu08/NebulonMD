[paths]
nmd_home = /home/sathi/Codebase/NebulonMD

[backend]
nebulondb_api_host = localhost
nebulondb_api_port = 6969
nebulondb_api_scheme = http
nebulondb_api_connect_timeout = 5.0
nebulondb_api_read_timeout = 30.0
nebulondb_api_write_timeout = 60.0

[server]
nebulondmind_api_host = 0.0.0.0
nebulondmind_api_port = 9696
nmd_api_workers = 1
nmd_api_graceful_shutdown_seconds = 30
nmd_api_max_body_bytes = 1048576
nmd_api_backend_retries = 2
nmd_api_rate_limit_per_minute = 0
nmd_api_max_top_k = 50
nmd_api_max_context_characters = 100000
nmd_api_cors_origins = http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500
nmd_api_allow_plaintext_http = false
nmd_env = development
nmd_expected_backend_version = 

[secrets_store]
nmd_secrets_corpus = nmd_Secrets
nmd_secrets_segment = Authentication

[llm]
nmd_llm_provider = nvidia
nmd_llm_model = nvidia/nemotron-3.5-lightning-30b-a3b
nmd_llm_timeout = 60
nmd_llm_max_retries = 3
nmd_llm_extractor = false

[lifecycle]
nmd_temporary_ttl_seconds = 2592000
nmd_lifecycle_auto_cleanup = true
nmd_lifecycle_auto_cleanup_cron = 0 3 * * *

[retrieval]
nmd_retrieval_top_k = 5
nmd_retrieval_candidates = 15

[ranking]
nmd_ranking_semantic_weight = 0.50
nmd_ranking_importance_weight = 0.20
nmd_ranking_confidence_weight = 0.15
nmd_ranking_recency_weight = 0.15
nmd_ranking_recency_half_life_days = 30

[context]
nmd_context_max_items = 10
nmd_context_max_characters = 6000

[agent]
nmd_agent_model = 
nmd_agent_temperature = 0.0
nmd_agent_max_turns = 4
nmd_agent_max_recall = 
nmd_agent_max_sessions = 100
nmd_agent_session_ttl_seconds = 3600
nmd_agent_durable_sessions = false
nmd_agent_system_prompt = 

[background]
nmd_background_user = nmd_user_01
nmd_background_persist_state = false

[runner]
nmd_skip_backend_check = false

